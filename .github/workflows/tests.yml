# Run the test suite on every push and pull request.
# Tests that need the full PyPSA-Earth Tunisia network (not stored in the repository) skip themselves;
# everything else runs on the small toy network. Versions match the local pypsa-earth environment.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypsa==0.30.3 linopy==0.5.5 highspy==1.11.0 pandas==2.3.1 numpy==1.26.4 \
                      xarray==2025.1.2 netcdf4==1.7.2 scipy==1.15.2 matplotlib==3.10.5 \
                      openpyxl==3.1.5 pyyaml==6.0.2 pytest pytest-cov
      - name: Run tests
        run: pytest -q --cov=tn2030 --cov-branch --cov-report=term
